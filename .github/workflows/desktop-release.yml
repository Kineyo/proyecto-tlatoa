name: "Build & Release Desktop Native (Rust Offline)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tlatoa-desktop-linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary_path: crates/tlatoa-desktop/target/release/tlatoa-desktop
          - os: windows-latest
            artifact_name: tlatoa-desktop-windows-x86_64.exe
            target: x86_64-pc-windows-msvc
            binary_path: crates/tlatoa-desktop/target/release/tlatoa-desktop.exe
          - os: macos-latest
            artifact_name: tlatoa-desktop-macos-x86_64
            target: x86_64-apple-darwin
            binary_path: crates/tlatoa-desktop/target/release/tlatoa-desktop

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Binario de Escritorio (${{ matrix.os }})
        working-directory: crates/tlatoa-desktop
        run: cargo build --release

      - name: Renombrar Artefacto
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ matrix.binary_path }} dist/${{ matrix.artifact_name }}

      - name: Publicar Binario en GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: false
          prerelease: false
