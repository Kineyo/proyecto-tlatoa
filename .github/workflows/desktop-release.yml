name: "Build & Release Desktop Native (Rust Offline)"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tlatoa-desktop-linux-x86_64
            bundle_stem: tlatoa-desktop-linux-x86_64-portable
            target: x86_64-unknown-linux-gnu
            binary_path: crates/tlatoa-desktop/target/release/tlatoa-desktop
          - os: windows-latest
            artifact_name: tlatoa-desktop-windows-x86_64.exe
            bundle_stem: tlatoa-desktop-windows-x86_64-portable
            target: x86_64-pc-windows-msvc
            binary_path: crates/tlatoa-desktop/target/release/tlatoa-desktop.exe
          - os: macos-latest
            artifact_name: tlatoa-desktop-macos-x86_64
            bundle_stem: tlatoa-desktop-macos-x86_64-portable
            target: x86_64-apple-darwin
            binary_path: crates/tlatoa-desktop/target/release/tlatoa-desktop

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar Base de Datos SQLite (tlatoa.db)
        shell: bash
        run: python tools/build_mobile_db.py

      - name: Configurar Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Binario de Escritorio (${{ matrix.os }})
        working-directory: crates/tlatoa-desktop
        shell: bash
        run: |
          cargo build --release || (rm -f Cargo.lock ../tlatoa-core/Cargo.lock && cargo build --release)

      - name: Empaquetar Distribución Portable (Binario + tlatoa.db)
        shell: bash
        run: |
          mkdir -p dist/portable
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"
          cp "${{ matrix.binary_path }}" "dist/portable/${{ matrix.artifact_name }}"
          cp storage/tlatoa.db dist/portable/tlatoa.db
          python -c "import shutil; shutil.make_archive('dist/${{ matrix.bundle_stem }}', 'zip', 'dist/portable')"
          rm -rf dist/portable

      - name: Subir Artefacto de Compilación (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle_stem }}
          path: dist/*
          if-no-files-found: error

      - name: Publicar Binarios en GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: false
          prerelease: false
