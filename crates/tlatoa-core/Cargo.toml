[package]
name = "tlatoa-core"
version = "1.0.0"
edition = "2021"
authors = ["Kineyo", "Proyecto Tlatoa"]
description = "Motor de consulta y búsqueda ultrarrápida offline para Proyecto Tlatoa"
license = "AGPL-3.0"

[lib]
name = "tlatoa_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tlatoa-cli"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = { version = "0.21", default-features = false }
